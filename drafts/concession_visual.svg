<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f2a6b"/>
    </marker>
  </defs>

  <rect width="960" height="650" fill="#f5f8fc"/>

  <!-- Title, in the style of the sticky notes -->
  <ellipse cx="150" cy="55" rx="118" ry="34" fill="none" stroke="#1f2a6b" stroke-width="2.5"/>
  <text x="150" y="64" font-size="28" text-anchor="middle" fill="#1f2a6b">Concession</text>
  <text x="298" y="48" font-size="18" fill="#1f2a6b">The speaker accepts a teammate's correction or challenge.</text>
  <text x="298" y="74" font-size="17" fill="#1f2a6b">The label names the kind: Concession: Error, Gap, Limit or Skill.</text>

  <!-- Concession family -->
  <rect x="30" y="110" width="625" height="400" rx="18" fill="none" stroke="#1f2a6b" stroke-width="2.5"/>

  <!-- Uptake field: Welcomed inside Accepted -->
  <text x="342" y="140" font-size="15" text-anchor="middle" fill="#1f2a6b">Uptake (a field, recorded for every Concession)</text>
  <ellipse cx="342" cy="245" rx="290" ry="92" fill="#ffffff" stroke="#1f2a6b" stroke-width="2"/>
  <ellipse cx="205" cy="245" rx="128" ry="64" fill="#eef1fb" stroke="#1f2a6b" stroke-width="2"/>
  <text x="205" y="236" font-size="21" text-anchor="middle" fill="#1f2a6b">Welcomed</text>
  <text x="205" y="259" font-size="13.5" text-anchor="middle" fill="#4a5590">accepts + positive uptake</text>
  <text x="205" y="279" font-size="13.5" font-style="italic" text-anchor="middle" fill="#4a5590">"Good catch, that's wrong."</text>
  <text x="482" y="236" font-size="22" text-anchor="middle" fill="#1f2a6b">Accepted</text>
  <text x="482" y="259" font-size="13.5" text-anchor="middle" fill="#4a5590">accepts the point</text>
  <text x="482" y="279" font-size="13.5" font-style="italic" text-anchor="middle" fill="#4a5590">"You're right, I don't."</text>

  <!-- Labels: one for each kind of the accepted shortfall -->
  <text x="342" y="368" font-size="15" text-anchor="middle" fill="#1f2a6b">Labels: the kind of the accepted shortfall gives the label.</text>
  <g fill="#ffffff" stroke="#1f2a6b" stroke-width="1.6">
    <rect x="50" y="383" width="137" height="107" rx="10"/>
    <rect x="199" y="383" width="137" height="107" rx="10"/>
    <rect x="348" y="383" width="137" height="107" rx="10"/>
    <rect x="497" y="383" width="137" height="107" rx="10"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2a6b">
    <text x="118.5" y="409">Error</text>
    <text x="267.5" y="409">Gap</text>
    <text x="416.5" y="409">Limit</text>
    <text x="565.5" y="409">Skill</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#4a5590">
    <text x="118.5" y="427">(wrong or failed)</text>
    <text x="267.5" y="427">(not known)</text>
    <text x="416.5" y="427">(cannot do)</text>
    <text x="565.5" y="427">(falls short in skill)</text>
  </g>
  <g font-size="13" font-style="italic" text-anchor="middle" fill="#4a5590">
    <text x="118.5" y="453">"You're right, I</text>
    <text x="118.5" y="471">had that wrong."</text>
    <text x="267.5" y="453">"You're right,</text>
    <text x="267.5" y="471">I don't."</text>
    <text x="416.5" y="453">"No, I can't</text>
    <text x="416.5" y="471">keep up."</text>
    <text x="565.5" y="453">"Fair, it's not</text>
    <text x="565.5" y="471">my strength."</text>
  </g>

  <!-- Arrow: a teammate raises the shortfall -->
  <line x1="340" y1="578" x2="340" y2="520" stroke="#1f2a6b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="340" y="604" font-size="18" text-anchor="middle" fill="#1f2a6b">teammate challenges  ⟹  the speaker accepts</text>
  <text x="340" y="628" font-size="14" text-anchor="middle" fill="#4a5590">always Prompted; the challenge is the stake evidence (Context)</text>

  <!-- Neighbours: what is not a Concession -->
  <text x="805" y="128" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2a6b">Not Concession</text>
  <g fill="#ffffff" stroke="#1f2a6b" stroke-width="1.6" stroke-dasharray="6 5">
    <rect x="670" y="142" width="270" height="78" rx="10"/>
    <rect x="670" y="232" width="270" height="78" rx="10"/>
    <rect x="670" y="322" width="270" height="78" rx="10"/>
    <rect x="670" y="412" width="270" height="78" rx="10"/>
  </g>
  <g font-size="15" fill="#1f2a6b">
    <text x="684" y="172">A neutral question came first</text>
    <text x="684" y="198">→ Owning-up, Prompted</text>
    <text x="684" y="262">A bare "okay" or "got it"</text>
    <text x="684" y="288">→ acknowledgment; no act</text>
    <text x="684" y="344">"You're right, but it was</text>
    <text x="684" y="364">the owner's call."</text>
    <text x="684" y="387">→ take-back; not a Concession</text>
    <text x="684" y="442">Dropping your own idea</text>
    <text x="684" y="468">→ X06; no shortfall</text>
  </g>

  <!-- Note on Uptake -->
  <g font-size="13" fill="#4a5590">
    <text x="670" y="530">Uptake is a field, not a label.</text>
    <text x="670" y="548">Welcomed sits inside Accepted,</text>
    <text x="670" y="566">because a welcome also accepts.</text>
    <text x="670" y="584">It replaces the two old Concession labels.</text>
  </g>
</svg>
